<style>

html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#1c1b19;color:#ece9e2;font-family:"IBM Plex Sans",sans-serif;box-sizing:border-box;padding:72px 96px 64px;display:flex;flex-direction:column;gap:30px}
.q{align-self:flex-end;background:#2a2925;border-radius:28px;padding:18px 30px;font-size:30px;line-height:1.3}
.status{font-size:20px;color:#a19d94;display:flex;align-items:center;gap:12px}
.status i{width:10px;height:10px;border-radius:50%;background:#d9a854}
.a{font-family:"Newsreader",serif;font-size:46px;line-height:1.35;margin:0;flex:1}
.chip{display:inline-block;font:500 18px/1 "IBM Plex Sans",sans-serif;color:#d9a854;border:1.5px solid rgba(217,168,84,.45);border-radius:999px;padding:8px 14px;vertical-align:8px;margin-left:6px}
.foot{display:flex;justify-content:space-between;font-size:20px;color:#a19d94;border-top:1px solid #34322d;padding-top:22px}
.foot b{color:#d9a854;font-weight:500}
</style>
</head>
